name: Build and test for EL9

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-el9:
    runs-on: ubuntu-24.04

    # All build commands run with AlmaLinux 9 libraries and headers.
    container:
      image: almalinux:9

    defaults:
      run:
        shell: bash

    steps:
      - name: Install EL9 build tools
        run: |
          dnf install -y \
            binutils \
            ca-certificates \
            cmake \
            file \
            gcc-c++ \
            git \
            gzip \
            libasan \
            liblsan \
            libubsan \
            make \
            python3 \
            python3.12 \
            python3.12-pip \
            python3-pip \
            tar
          gcc --version
          cmake --version
          getconf GNU_LIBC_VERSION
          python3.12 --version

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: |
          cmake \
            -S backend \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        env:
          LSAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary dependencies
        run: |
          binary=build/app/ryfmach

          file "$binary"
          ldd "$binary"

          if ldd "$binary" | grep -q "not found"; then
            echo "Binary has unresolved shared libraries"
            exit 1
          fi

      - name: Assemble release
        run: |
          release_name="ryfmach-${GITHUB_SHA::12}-el9-x86_64"

          mkdir -p \
            "stage/${release_name}/bin" \
            "stage/${release_name}/python" \
            "stage/${release_name}/frontend" \
            "stage/${release_name}/data" \
            dist

          install -m 0755 \
            build/app/ryfmach \
            "stage/${release_name}/bin/ryfmach"

          install -m 0644 \
            python-legacy/main.py \
            python-legacy/config.py \
            python-legacy/requirements.txt \
            "stage/${release_name}/python/"

          cp -a \
            frontend/static \
            "stage/${release_name}/frontend/"

          install -m 0644 \
            backend/lib/bel_lang_engine/data/sound_compatibility.tsv \
            "stage/${release_name}/data/sound_compatibility.tsv"

          install -m 0644 \
            .env.example \
            "stage/${release_name}/.env.example"

          printf '%s\n' "$GITHUB_SHA" \
            > "stage/${release_name}/VERSION"

          required_files=(
            bin/ryfmach
            data/sound_compatibility.tsv
            frontend/static/templates/index.html
            python/config.py
            python/main.py
            python/requirements.txt
            .env.example
            VERSION
          )

          for required_file in "${required_files[@]}"; do
            test -f "stage/${release_name}/${required_file}"
          done

          test -x "stage/${release_name}/bin/ryfmach"
          test -s "stage/${release_name}/VERSION"

          python3.12 -m venv python-test
          python-test/bin/python -m pip install \
            --requirement "stage/${release_name}/python/requirements.txt"
          python-test/bin/python -c "import flask, gunicorn"

          (
            cd "stage/${release_name}"
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

          tar -C stage -czf "dist/${release_name}.tar.gz" "$release_name"

          (
            cd dist
            sha256sum "${release_name}.tar.gz" > "${release_name}.tar.gz.sha256"
          )

          mkdir archive-test
          tar -C archive-test -xzf "dist/${release_name}.tar.gz"
          test -x "archive-test/${release_name}/bin/ryfmach"
          (
            cd "archive-test/${release_name}"
            sha256sum --check SHA256SUMS
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ryfmach-el9-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
