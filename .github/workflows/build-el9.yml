name: Build and test for EL9

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-el9:
    runs-on: ubuntu-24.04

    # All build commands run with AlmaLinux 9 libraries and headers.
    container:
      image: almalinux:9

    defaults:
      run:
        shell: bash

    steps:
      - name: Install EL9 build tools
        run: |
          dnf install -y \
            binutils \
            ca-certificates \
            cmake \
            file \
            gcc-c++ \
            git \
            gzip \
            make \
            python3 \
            python3-pip \
            tar
          gcc --version
          cmake --version
          getconf GNU_LIBC_VERSION

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: |
          cmake \
            -S backend \
            -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        env:
          LSAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary ABI
        run: |
          binary=build/app/ryfmach

          file "$binary"
          ldd "$binary"

          if ldd "$binary" | grep -q "not found"; then
            echo "Binary has unresolved shared libraries"
            exit 1
          fi

          max_glibc="$(
            readelf --version-info "$binary" |
              sed -n 's/.*Name: GLIBC_\([^ ]*\).*/\1/p' |
              sort -V |
              tail -1
          )"

          max_glibcxx="$(
            readelf --version-info "$binary" |
              sed -n 's/.*Name: GLIBCXX_\([^ ]*\).*/\1/p' |
              sort -V |
              tail -1
          )"

          echo "Maximum required glibc: GLIBC_${max_glibc}"
          echo "Maximum required libstdc++: GLIBCXX_${max_glibcxx}"

          if [[ "$(printf '%s\n' "$max_glibc" 2.34 | sort -V | tail -1)" != "2.34" ]]; then
            echo "Binary requires glibc newer than EL9"
            exit 1
          fi

          # EL9's GCC 11 libstdc++ provides up to GLIBCXX_3.4.29.
          if [[ "$(printf '%s\n' "$max_glibcxx" 3.4.29 | sort -V | tail -1)" != "3.4.29" ]]; then
            echo "Binary requires libstdc++ newer than standard EL9"
            exit 1
          fi

      - name: Assemble release
        run: |
          release_name="ryfmach-${GITHUB_SHA::12}-el9-x86_64"

          mkdir -p \
            "stage/${release_name}/bin" \
            "stage/${release_name}/python" \
            "stage/${release_name}/frontend" \
            "stage/${release_name}/data" \
            "stage/${release_name}/wheelhouse" \
            dist

          install -m 0755 \
            build/app/ryfmach \
            "stage/${release_name}/bin/ryfmach"

          install -m 0644 \
            python-legacy/main.py \
            python-legacy/config.py \
            python-legacy/requirements.txt \
            "stage/${release_name}/python/"

          cp -a \
            frontend/static \
            "stage/${release_name}/frontend/"

          install -m 0644 \
            backend/lib/bel_lang_engine/data/sound_compatibility.tsv \
            "stage/${release_name}/data/sound_compatibility.tsv"

          install -m 0644 \
            .env.example \
            "stage/${release_name}/.env.example"

          python3 -m pip download \
            --dest "stage/${release_name}/wheelhouse" \
            --requirement python-legacy/requirements.txt

          printf '%s\n' "$GITHUB_SHA" \
            > "stage/${release_name}/VERSION"

          tar -C stage -czf "dist/${release_name}.tar.gz" "$release_name"

          (
            cd dist
            sha256sum "${release_name}.tar.gz" > "${release_name}.tar.gz.sha256"
          )

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ryfmach-el9-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
