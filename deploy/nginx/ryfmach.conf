upstream ryfmach_api {
	server 127.0.0.1:8081;
	keepalive 16;
}

upstream ryfmach_flask {
	server 127.0.0.1:8082;
	keepalive 16;
}

server {
	listen 80;
	server_name ryfmach.online;
	access_log /var/log/ryfmach/access.log;
	error_log /var/log/ryfmach/error.log;

	location = /health {
		proxy_pass http://ryfmach_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /rhymes {
		proxy_pass http://ryfmach_api;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_next_upstream off;
	}

	location / {
		proxy_pass http://ryfmach_flask;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
